# ===============================
# SERVER CONFIG
# ===============================
server.port=8081
spring.application.name=payment-service

# ===============================
# SECURITY
# ===============================
jwt.secret=THIS_IS_A_32+_CHAR_SECRET_KEY_FOR_HS256
jwt.expiration=3600000

# ===============================
# DATABASE CONFIG (LOCAL DEV USING AZURE SQL)
# ===============================
spring.datasource.url=jdbc:sqlserver://myapp-sql-dev-dun4igrgsr6wu.database.windows.net:1433;database=appdb;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
spring.datasource.username=sqladminuser
spring.datasource.password=SpringBoot#Dev_2026!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.example.payment=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} traceId=%X{traceId} - %msg%n

# ===============================
# KAFKA CONFIG (LOCAL)
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.payment.event

spring.kafka.properties.request.timeout.ms=60000
spring.kafka.properties.metadata.max.age.ms=180000
spring.kafka.properties.connections.max.idle.ms=180000
spring.kafka.properties.client.dns.lookup=use_all_dns_ips

payment.kafka.topic.created=payment.created

# ===============================
# SCHEDULER
# ===============================
spring.task.scheduling.pool.size=5

# ===============================
# RESILIENCE4J
# ===============================
resilience4j.circuitbreaker.instances.paymentServiceCircuit.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.paymentServiceCircuit.slidingWindowSize=10
resilience4j.circuitbreaker.instances.paymentServiceCircuit.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.paymentServiceCircuit.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentServiceCircuit.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.paymentServiceCircuit.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.paymentServiceCircuit.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.retry.instances.paymentServiceRetry.maxAttempts=3
resilience4j.retry.instances.paymentServiceRetry.waitDuration=2s

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ===============================
# REDIS CONFIG (LOCAL)
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms
spring.data.redis.ssl.enabled=false

spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=2000ms

# ===============================
# APP SETTINGS
# ===============================
rate.limit.enabled=true
applicationinsights.connection.string=