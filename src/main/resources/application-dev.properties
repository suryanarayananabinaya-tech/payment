# ===============================
# SERVER
# ===============================
server.port=${HTTP_PLATFORM_PORT:${PORT:8080}}
spring.application.name=payment-service

# ===============================
# SECURITY
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ===============================
# AZURE SQL DATABASE
# ===============================
spring.datasource.url=jdbc:sqlserver://myapp-sql-dev-dun4igrgsr6wu.database.windows.net:1433;database=appdb;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.example.payment=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} traceId=%X{traceId} - %msg%n

# ===============================
# KAFKA
# ===============================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.payment.event

# ===============================
# SCHEDULING / OUTBOX PUBLISHER
# ===============================
spring.task.scheduling.pool.size=5

# ===============================
# RESILIENCE4J CIRCUIT BREAKER
# ===============================
resilience4j.circuitbreaker.instances.paymentServiceCircuit.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.paymentServiceCircuit.slidingWindowSize=10
resilience4j.circuitbreaker.instances.paymentServiceCircuit.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.paymentServiceCircuit.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentServiceCircuit.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.paymentServiceCircuit.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.paymentServiceCircuit.automaticTransitionFromOpenToHalfOpenEnabled=true

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true