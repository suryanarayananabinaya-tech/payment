server.port=${HTTP_PLATFORM_PORT:${PORT:8080}}
spring.application.name=payment-service

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}
spring.data.redis.timeout=5s

logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.example.payment=${LOGGING_LEVEL_COM_EXAMPLE_PAYMENT:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} traceId=%X{traceId} - %msg%n

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:payment-group}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.payment.event

payment.kafka.topic.created=${KAFKA_TOPIC_PAYMENT_CREATED:payment-created}

spring.task.scheduling.pool.size=5

resilience4j.circuitbreaker.instances.paymentServiceCircuit.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.paymentServiceCircuit.slidingWindowSize=10
resilience4j.circuitbreaker.instances.paymentServiceCircuit.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.paymentServiceCircuit.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentServiceCircuit.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.paymentServiceCircuit.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.paymentServiceCircuit.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.retry.instances.paymentServiceRetry.maxAttempts=3
resilience4j.retry.instances.paymentServiceRetry.waitDuration=2s

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
management.health.circuitbreakers.enabled=${MANAGEMENT_HEALTH_CIRCUITBREAKERS_ENABLED:true}
management.endpoint.health.probes.enabled=${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
management.health.livenessstate.enabled=${MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED:true}
management.health.readinessstate.enabled=${MANAGEMENT_HEALTH_READINESSSTATE_ENABLED:true}

applicationinsights.connection.string=${APPINSIGHTS_CONNECTION_STRING:}
rate.limit.enabled=true