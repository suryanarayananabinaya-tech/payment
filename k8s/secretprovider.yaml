apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: payment-kv
  namespace: dev
spec:
  provider: azure
  parameters:
    clientID: "REPLACE_LATER"
    keyvaultName: "REPLACE_LATER"
    tenantId: "REPLACE_LATER"
    objects: |
      array:
        - |
          objectName: jwt-secret
          objectType: secret
        - |
          objectName: db-username
          objectType: secret
        - |
          objectName: db-password
          objectType: secret