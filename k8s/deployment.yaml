apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: payment-sa
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "payment-kv"
      containers:
        - name: payment-service
          image: PLACEHOLDER_IMAGE
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
          env:
            - name: PORT
              value: "8080"
          command: ["/bin/sh","-c"]
          args:
            - |
              export JWT_SECRET="$(cat /mnt/secrets-store/jwt-secret)" &&
              export DB_USERNAME="$(cat /mnt/secrets-store/db-username)" &&
              export DB_PASSWORD="$(cat /mnt/secrets-store/db-password)" &&
              exec java -jar /app/app.jar