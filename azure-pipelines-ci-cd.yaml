trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  azureSubscription: 'Abinaya-Azure-dev-Connection'
  resourceGroup: 'springboot-rg-dev'
  aksName: 'pay-aks-dev'
  acrName: 'payacrdev12345'
  namespace: 'dev'
  imageName: 'payment-service'
  imageTag: '$(Build.BuildId)'
  javaVersion: '21'
  sonarServiceConnection: 'SonarQube-Connection'
  sonarProjectKey: 'payment-service'
  sonarProjectName: 'Payment Service'

stages:
  - stage: CI_Build
    displayName: "CI - Build, Test, Sonar, and Push Image to ACR"
    jobs:
      - job: BuildPush
        displayName: "Build, Test, Analyze, Push"
        steps:
          - checkout: self

          - task: SonarQubePrepare@5
            displayName: 'Prepare SonarQube analysis'
            inputs:
              SonarQube: '$(sonarServiceConnection)'
              scannerMode: 'Other'
              configMode: 'manual'
              cliProjectKey: '$(sonarProjectKey)'
              cliProjectName: '$(sonarProjectName)'

          - task: Maven@4
            displayName: 'Maven: clean verify'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean verify'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.$(javaVersion)'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'

          - task: SonarQubeAnalyze@5
            displayName: 'Run SonarQube analysis'

          - task: SonarQubePublish@5
            displayName: 'Publish SonarQube quality gate result'
            inputs:
              pollingTimeoutSec: '300'

          - task: AzureCLI@2
            displayName: "ACR Build (Dockerfile builds jar inside container) + Push"
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                echo "Building image: $(imageName):$(imageTag)"
                az acr build \
                  -g "$(resourceGroup)" \
                  -r "$(acrName)" \
                  -t "$(imageName):$(imageTag)" \
                  .

  - stage: CD_Deploy
    displayName: "CD - Deploy to AKS"
    dependsOn: CI_Build
    jobs:
      - job: Deploy
        displayName: "Deploy to AKS"
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: "kubectl apply + update image"
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                ACR_LOGIN_SERVER=$(az acr show -g "$(resourceGroup)" -n "$(acrName)" --query loginServer -o tsv)
                FULL_IMAGE="$ACR_LOGIN_SERVER/$(imageName):$(imageTag)"
                echo "Deploying image: $FULL_IMAGE"

                az aks get-credentials -g "$(resourceGroup)" -n "$(aksName)" --overwrite-existing

                kubectl apply -f k8s/namespace.yaml
                kubectl apply -f k8s/serviceaccount.yaml
                kubectl apply -f k8s/secretprovider.yaml
                kubectl apply -f k8s/service.yaml
                kubectl apply -f k8s/deployment.yaml

                kubectl -n "$(namespace)" set image deployment/payment-service \
                  payment-service="$FULL_IMAGE"

                kubectl -n "$(namespace)" rollout status deployment/payment-service --timeout=180s

                kubectl -n "$(namespace)" get pods
                kubectl -n "$(namespace)" get svc payment-service-svc